name: pytest

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          # Dummy placeholders only. Tests mock Notion/OpenAI and never call live APIs.
          NOTION_TOKEN: secret_ci_placeholder
          NOTION_DATABASE_ID: ci-database-id
          OPENAI_API_KEY: sk-test-not-a-real-key
        run: pytest -v tests/
